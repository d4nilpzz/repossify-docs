<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="title" content="Repossify · Maven Repository">
    <meta name="description"
        content="Self-hosted Maven repository manager. Host your Java artifacts privately with full control. Free for personal use and small teams.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maven.repossify.dev/">
    <meta property="og:title" content="Repossify · Maven Repository">
    <meta property="og:description"
        content="Self-hosted Maven repository manager. Host your Java artifacts privately with full control.">
    <meta property="og:image" content="https://repossify.dev/public/repossify.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://maven.repossify.dev/">
    <meta name="twitter:title" content="Repossify · Maven Repository">
    <meta name="twitter:description"
        content="Self-hosted Maven repository manager. Host your Java artifacts privately.">
    <meta name="twitter:image" content="https://repossify.dev/public/repossify.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @font-face {
            font-family: 'Playfair Display';
            src: url('public/font/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
            font-weight: 400 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'Playfair Display';
            src: url('public/font/PlayfairDisplay-Italic-VariableFont_wght.ttf') format('truetype');
            font-weight: 400 900;
            font-style: italic;
            font-display: swap;
        }

        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
        }
    </style>
    <title>Repossify · Maven Repository</title>
</head>

<body class="bg-[#141414] text-white h-screen overflow-hidden flex flex-col">
    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-6">
        <div class="w-full max-w-xl flex flex-col gap-6">

            <!-- Status -->
            <div class="flex items-center gap-2">
                <span class="relative flex size-2">
                    <span
                        class="absolute inline-flex h-full w-full animate-ping rounded-full bg-orange-400 opacity-75"></span>
                    <span class="relative inline-flex size-2 rounded-full bg-orange-500"></span>
                </span>
                <span class="text-orange-400 text-[12px] font-medium uppercase tracking-widest">In Development</span>
            </div>

            <!-- Hero -->
            <div class="flex flex-col gap-3">
                <h1 class="text-[42px] text-white/70 font-extrabold leading-tight">
                    <span class="italic text-white">Repossify</span>, Your private<br>
                    Maven repository
                </h1>
                <p class="text-[16px] text-white/60 leading-relaxed">
                    Repossify gives you a fully self-hosted Maven repository. Deploy with Docker or a standalone
                    <code class="text-white/80 bg-white/5 px-1.5 py-0.5 rounded text-[13px]">.jar</code>,
                    publish your artifacts privately, and integrate in seconds.
                </p>
            </div>

            <!-- CTA -->
            <div class="flex items-center gap-3">
                <a href="https://github.com/d4nilpzz/repossify" target="_blank"
                    class="gap-2 h-auto px-2 py-1.5 flex items-center text-white/80 border-[2px] border-white/10 rounded-[12px] text-[13px] hover:border-white/20 transition-colors">
                    <span>Star on GitHub</span>
                    <span id="starCount" class="font-semibold bg-white/10 w-[22px] flex items-center justify-center rounded-[4px]">—</span>
                </a>
            </div>

        </div>
    </main>

    <script>
        async function fetchGithubStar() {
            try {
                const res = await fetch("https://api.github.com/repos/d4nilpzz/repossify");
                const data = await res.json();
                document.getElementById("starCount").innerText = data.stargazers_count;
            } catch (_) { }
        }
        fetchGithubStar();
    </script>
</body>

</html>
